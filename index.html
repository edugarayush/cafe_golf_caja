<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoyo 19 — Recepción</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Cinzel:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --verde:  #1A3A1A;
    --verde2: #2D5A2D;
    --gold:   #C9A84C;
    --bg:     #1C1C1C;
    --card:   #242424;
    --txt:    #F0F0F0;
    --txt2:   #888;
    --border: #333333;
    --ok:     #4CAF50;
    --ok-bg:  #1A2E1A;
    --warn:   #C9A84C;
    --warn-bg:#2A2210;
    --err:    #EF5350;
    --err-bg: #2A1010;
    --radius: 18px;
    --shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  body { font-family: "DM Sans", sans-serif; background: #141414; min-height: 100vh; color: var(--txt); }

  .header-img-wrap {
    width: 100%;
    background-color: #FFFFFF;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 0 24px;
  }
  .header-img-wrap img {
    height: 110px;
    width: auto;
    display: block;
  }
  
  
  .header-badge { background: #C9A84C22; border: 1px solid #C9A84C55; color: var(--gold); font-size: 11px; padding: 5px 14px; border-radius: 20px; }
  .btn-cierre { padding: 6px 14px; background: transparent; border: 1px solid var(--gold); border-radius: 20px; color: var(--gold); font-family: "DM Sans", sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .btn-cierre:hover { background: #C9A84C22; }

  .header-bar { background: #1A3A1A; border-bottom: 2px solid #C9A84C; padding: 10px 20px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .header-badge { background: #C9A84C22; border: 1px solid #C9A84C55; color: #C9A84C; font-size: 11px; padding: 5px 14px; border-radius: 20px; }
  .btn-cierre { padding: 6px 14px; background: transparent; border: 1px solid #C9A84C; border-radius: 20px; color: #C9A84C; font-family: "DM Sans", sans-serif; font-size: 12px; font-weight: 500; cursor: pointer; transition: all .15s; }
  .btn-cierre:hover { background: #C9A84C22; }
  .container { max-width: 560px; margin: 0 auto; padding: 28px 16px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-title { font-family: "Cormorant Garamond", serif; font-size: 19px; color: var(--verde); margin-bottom: 18px; font-weight: 600; }

  .search-row { display: flex; gap: 10px; }
  .search-row input { flex: 1; padding: 13px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-family: "DM Sans", sans-serif; font-size: 16px; color: var(--txt); background: #2A2A2A; -webkit-appearance: none; transition: border-color .15s; color: #F0F0F0; }
  .search-row input:focus { outline: none; border-color: var(--gold); background: #2A2A2A; }
  .btn-buscar { padding: 13px 22px; background: var(--verde); color: var(--gold); border: none; border-radius: 12px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all .15s; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .btn-buscar:hover { background: var(--verde2); }
  .btn-buscar:disabled { background: #ccc; color: #888; cursor: not-allowed; }

  .alert { border-radius: 12px; padding: 12px 16px; font-size: 14px; margin-top: 14px; display: none; }
  .alert.ok   { background: var(--ok-bg);   color: var(--ok);   display: block; }
  .alert.warn { background: var(--warn-bg); color: var(--warn); display: block; }
  .alert.err  { background: var(--err-bg);  color: var(--err);  display: block; }

  .socio-card { display: none; }
  .socio-card.visible { display: block; }
  .socio-header { background: linear-gradient(135deg, #1a3a1a, #2d5a2d); border-radius: 16px 16px 0 0; padding: 20px 22px; display: flex; align-items: center; gap: 14px; }
  .avatar { width: 54px; height: 54px; border-radius: 50%; background: #C9A84C22; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: "Cormorant Garamond", serif; font-size: 20px; font-weight: 600; color: var(--gold); flex-shrink: 0; }
  .socio-nombre { font-size: 18px; font-weight: 500; color: #F0E8D0; }
  .socio-dni    { font-size: 13px; color: #9FBE9F; margin-top: 3px; }
  .socio-body { border: 1px solid var(--border); border-top: none; border-radius: 0 0 16px 16px; padding: 22px; box-shadow: var(--shadow); }

  .counter { text-align: center; padding: 16px 0 20px; }
  .counter-num { font-size: 96px; font-weight: 300; color: var(--verde); line-height: 1; transition: all .3s; }
  .counter-num.restando { transform: scale(1.15); color: var(--gold); }
  .counter-label { font-size: 13px; color: var(--txt2); margin-top: 6px; }

  .cups { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 22px; }
  .cup { font-size: 20px; transition: all .2s; }
  .cup.empty { opacity: .12; }

  .cantidad-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 18px; }
  .btn-qty { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--border); background: var(--card); font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--txt2); transition: all .15s; }
  .btn-qty:hover { border-color: var(--verde); color: var(--verde); }
  .qty-num { font-size: 24px; font-weight: 500; min-width: 32px; text-align: center; }
  .qty-label { font-size: 13px; color: var(--txt2); text-align: center; margin-top: 2px; }

  .btn-dispensar { width: 100%; padding: 18px; border: none; border-radius: 14px; background: var(--verde); color: var(--gold); font-family: "DM Sans", sans-serif; font-size: 17px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all .15s; }
  .btn-dispensar:hover:not(:disabled) { background: var(--verde2); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,58,26,0.25); }
  .btn-dispensar:active:not(:disabled) { transform: scale(0.98); }
  .btn-dispensar:disabled { background: #ddd; color: #aaa; cursor: not-allowed; }
  .btn-dispensar .cup-big { font-size: 22px; }
  .vence-info { text-align: center; font-size: 12px; color: var(--txt2); margin-top: 10px; }

  .btn-volver { width: 100%; padding: 13px; margin-top: 14px; border: 1.5px solid var(--border); border-radius: 12px; background: transparent; color: var(--txt2); font-family: "DM Sans", sans-serif; font-size: 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .15s; }
  .btn-volver:hover { border-color: var(--verde); color: var(--verde); }

  .hist-title { font-size: 12px; font-weight: 600; color: var(--txt2); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px; }
  .hist-item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .hist-item:last-child { border-bottom: none; }
  .hist-nombre { flex: 1; font-size: 13px; font-weight: 500; }
  .hist-hora   { font-size: 12px; color: var(--txt2); }
  .hist-qty    { font-size: 12px; color: var(--txt2); }
  .empty-hist  { font-size: 13px; color: var(--txt2); text-align: center; padding: 16px 0; }

  .spinner { width: 17px; height: 17px; border: 2px solid rgba(201,168,76,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(90px); background: var(--verde); color: var(--gold); padding: 13px 26px; border-radius: 14px; border: 1px solid #C9A84C44; font-size: 14px; font-weight: 500; transition: transform .3s ease; z-index: 100; white-space: nowrap; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; display: none; align-items: flex-start; justify-content: center; padding: 20px 16px 40px; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg); border-radius: 20px; width: 100%; max-width: 600px; margin: auto; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,0.4); }
  .modal-header { background: var(--verde); border-bottom: 2px solid var(--gold); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
  .modal-header h2 { font-family: "Cormorant Garamond", serif; color: var(--gold); font-size: 22px; font-weight: 600; }
  .modal-header p  { font-size: 12px; color: #9FBE9F; margin-top: 3px; }
  .btn-cerrar-modal { background: transparent; border: none; color: #9FBE9F; font-size: 22px; cursor: pointer; padding: 4px 8px; line-height: 1; }
  .btn-cerrar-modal:hover { color: var(--gold); }
  .modal-body { padding: 24px; }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 12px; text-align: center; box-shadow: var(--shadow); }
  .kpi-num   { font-size: 36px; font-weight: 300; color: var(--verde); line-height: 1; }
  .kpi-label { font-size: 11px; color: var(--txt2); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

  .section-title { font-family: "Cormorant Garamond", serif; font-size: 17px; color: var(--verde); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .franja-row { margin-bottom: 14px; }
  .franja-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .franja-nombre { font-size: 14px; font-weight: 500; color: var(--txt); }
  .franja-detalle { font-size: 12px; color: var(--txt2); }
  .franja-bar-bg { height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .franja-bar { height: 100%; border-radius: 10px; background: linear-gradient(90deg, var(--verde), var(--verde2)); transition: width .6s ease; }

  .socios-tabla { width: 100%; border-collapse: collapse; font-size: 13px; }
  .socios-tabla th { text-align: left; font-size: 11px; color: var(--txt2); text-transform: uppercase; letter-spacing: 1px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .socios-tabla td { padding: 8px; border-bottom: 1px solid #F0EBE0; }
  .socios-tabla tr:last-child td { border-bottom: none; }
  .socios-tabla .badge-cafes { background: var(--ok-bg); color: var(--ok); padding: 2px 8px; border-radius: 10px; font-weight: 500; }

  .informe-loading { text-align: center; padding: 40px 20px; color: var(--txt2); }
  .informe-loading .spin { font-size: 32px; animation: spin .7s linear infinite; display: inline-block; margin-bottom: 12px; }
  .informe-error { text-align: center; padding: 30px; }

  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-pdf { flex: 1; padding: 13px; border: none; border-radius: 12px; background: var(--verde); color: var(--gold); font-family: "DM Sans", sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: background .15s; }
  .btn-pdf:hover { background: var(--verde2); }
  .btn-cancelar { padding: 13px 20px; border: 1.5px solid var(--border); border-radius: 12px; background: transparent; color: var(--txt2); font-family: "DM Sans", sans-serif; font-size: 15px; cursor: pointer; transition: all .15s; }
  .btn-cancelar:hover { border-color: var(--verde); color: var(--verde); }

  @media print {
    body * { visibility: hidden; }
    .modal-overlay, .modal-overlay * { visibility: visible; }
    .modal-overlay { position: absolute; inset: 0; padding: 0; background: white; display: block !important; }
    .modal { box-shadow: none; border-radius: 0; max-width: 100%; }
    .modal-actions, .btn-cerrar-modal { display: none !important; }
  }
</style>
</head>

      </button>
      <div class="vence-info" id="venceInfo"></div>
      <div class="alert" id="alertDispensar" style="margin-top:12px"></div>
      <button class="btn-volver" onclick="volverHome()">← Nueva búsqueda</button>
    </div>
  </div>

  <div class="card">
    <div class="hist-title">Historial del turno</div>
    <div id="historial"><div class="empty-hist">Sin movimientos aún.</div></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2>☕ Informe de Cierre</h2>
        <p id="modalFecha">—</p>
      </div>
      <button class="btn-cerrar-modal" onclick="cerrarInforme()">✕</button>
    </div>
    <div class="modal-body" id="modalBody">
      <div class="informe-loading"><div class="spin">⚙️</div><p>Cargando datos...</p></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw0BTkay6iDl9Lm5tZXHocwNaHda-tK8qoGCAI9Q4ljiWT5OnQt5o4vvUjQhO5YmiFL/exec';
let socioActual = null, qty = 1, historial = [];

function buscar() {
  const dni = document.getElementById('dniInput').value.trim();
  const al = document.getElementById('alertBuscar');
  if (!/^\d{7,8}$/.test(dni)) { showAlert(al, 'err', 'Ingresá un DNI válido (7 u 8 números).'); return; }
  setLoading(true);
  document.getElementById('socioCard').classList.remove('visible');
  al.style.display = 'none';
  fetch(API_URL + '?action=verificar&dni=' + dni)
    .then(r => r.json())
    .then(data => {
      setLoading(false);
      if (!data.ok) { showAlert(al, 'err', data.msg || 'DNI no encontrado.'); return; }
      if (data.estado !== 'ACTIVO') { showAlert(al, 'warn', data.nombre + ' — membresía ' + data.estado + '. No puede consumir cafés.'); return; }
      socioActual = data; qty = 1; mostrarSocio(data);
    })
    .catch(() => { setLoading(false); showAlert(al, 'err', 'Error de conexión.'); });
}

function mostrarSocio(data) {
  const iniciales = data.nombre.split(' ').map(n => n[0]).join('').substring(0,2).toUpperCase();
  document.getElementById('avatar').textContent = iniciales;
  document.getElementById('socioNombre').textContent = data.nombre;
  document.getElementById('socioDni').textContent = 'DNI ' + data.dni;
  document.getElementById('alertDispensar').style.display = 'none';
  actualizarContador(data.cafes);
  if (data.vence) document.getElementById('venceInfo').textContent = 'Membresía vence: ' + data.vence;
  document.getElementById('socioCard').classList.add('visible');
  actualizarBoton();
}

function actualizarContador(cafes) {
  const el = document.getElementById('counterNum');
  el.textContent = cafes;
  el.style.color = cafes === 0 ? 'var(--err)' : cafes <= 3 ? '#8A6A1A' : 'var(--verde)';
  const cups = document.getElementById('cupsRow');
  cups.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const c = document.createElement('span');
    c.className = 'cup' + (i >= cafes ? ' empty' : '');
    c.textContent = '☕';
    cups.appendChild(c);
  }
}

function cambiarQty(delta) {
  if (!socioActual) return;
  qty = Math.max(1, Math.min(qty + delta, socioActual.cafes));
  document.getElementById('qtyNum').textContent = qty;
  actualizarBoton();
}

function actualizarBoton() {
  const btn = document.getElementById('btnDispensar');
  const txt = document.getElementById('btnDispensarTxt');
  if (!socioActual || socioActual.cafes <= 0) { btn.disabled = true; txt.textContent = 'Sin cafés disponibles'; }
  else { btn.disabled = false; txt.textContent = qty === 1 ? 'Dar café — descontar 1' : 'Dar ' + qty + ' cafés — descontar ' + qty; }
}

function dispensar() {
  if (!socioActual || socioActual.cafes <= 0) return;
  document.getElementById('btnDispensar').disabled = true;
  dispensarUno(qty, () => actualizarBoton());
}

function dispensarUno(restantes, callback) {
  if (restantes <= 0) {
    const ahora = new Date();
    const hora = ahora.getHours().toString().padStart(2,'0') + ':' + ahora.getMinutes().toString().padStart(2,'0');
    historial.unshift({ nombre: socioActual.nombre, hora, qty: qty - restantes, restantes: socioActual.cafes });
    renderHistorial();
    showToast('☕ ' + qty + ' café' + (qty>1?'s':'') + ' servido' + (qty>1?'s':'') + ' a ' + socioActual.nombre);
    qty = 1; document.getElementById('qtyNum').textContent = 1;
    callback(); return;
  }
  fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'dispensar', dni: socioActual.dni, turno: 'recepcion' }) })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        socioActual.cafes = data.cafesRestantes;
        actualizarContador(data.cafesRestantes);
        const num = document.getElementById('counterNum');
        num.classList.add('restando');
        setTimeout(() => num.classList.remove('restando'), 300);
        dispensarUno(restantes - 1, callback);
      } else { showAlert(document.getElementById('alertDispensar'), 'err', data.msg); callback(); }
    })
    .catch(() => { showAlert(document.getElementById('alertDispensar'), 'err', 'Error de conexión.'); callback(); });
}

function renderHistorial() {
  const el = document.getElementById('historial');
  if (!historial.length) { el.innerHTML = '<div class="empty-hist">Sin movimientos aún.</div>'; return; }
  el.innerHTML = historial.slice(0,8).map(h =>
    '<div class="hist-item"><span>☕</span><span class="hist-nombre">' + h.nombre + '</span><span class="hist-hora">' + h.hora + '</span><span class="hist-qty">' + h.restantes + ' restantes</span></div>'
  ).join('');
}

function volverHome() {
  socioActual = null; qty = 1;
  document.getElementById('socioCard').classList.remove('visible');
  document.getElementById('dniInput').value = '';
  document.getElementById('alertBuscar').style.display = 'none';
  document.getElementById('dniInput').focus();
}

function setLoading(on) {
  document.getElementById('btnBuscar').disabled = on;
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('btnTxt').style.opacity = on ? '0.4' : '1';
}

function showAlert(el, tipo, msg) { el.className = 'alert ' + tipo; el.textContent = msg; }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

const FRANJAS = [
  { nombre: 'Mañana',   emoji: '🌅', desde: 6,  hasta: 12 },
  { nombre: 'Mediodía', emoji: '☀️', desde: 12, hasta: 16 },
  { nombre: 'Tarde',    emoji: '🌇', desde: 16, hasta: 20 },
  { nombre: 'Noche',    emoji: '🌙', desde: 20, hasta: 24 },
];

function abrirInforme() {
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalBody').innerHTML = '<div class="informe-loading"><div class="spin">⚙️</div><p>Cargando datos del día...</p></div>';
  const hoy = new Date();
  const fs = hoy.toLocaleDateString('es-AR', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  document.getElementById('modalFecha').textContent = fs.charAt(0).toUpperCase() + fs.slice(1);
  fetch(API_URL + '?action=informe_dia')
    .then(r => r.json())
    .then(data => { if (!data.ok) throw new Error(data.msg); renderInforme(data); })
    .catch(err => { console.warn(err); renderInformeFallback(); });
}

function cerrarInforme() { document.getElementById('modalOverlay').classList.remove('open'); }

function renderInforme(data) {
  const mov = data.movimientos || [];
  document.getElementById('modalBody').innerHTML = buildInformeHTML(
    data.total_cafes || 0, data.total_socios || 0,
    data.primer_movimiento || '—', data.ultimo_movimiento || '—',
    calcularFranjas(mov), mov, data.total_cafes || 0
  );
}

function renderInformeFallback() {
  if (!historial.length) {
    document.getElementById('modalBody').innerHTML = '<div class="informe-error"><p style="font-size:32px;margin-bottom:12px">📭</p><p style="color:var(--txt2);font-size:14px">Sin movimientos en esta sesión.</p></div>';
    return;
  }
  const porSocio = {};
  historial.forEach(h => {
    if (!porSocio[h.nombre]) porSocio[h.nombre] = { nombre: h.nombre, cafes: 0, horarios: [] };
    porSocio[h.nombre].cafes += (h.qty || 1);
    porSocio[h.nombre].horarios.push(h.hora);
  });
  const mov = Object.values(porSocio);
  const total = mov.reduce((s,m) => s + m.cafes, 0);
  const horas = historial.map(h => h.hora).sort();
  document.getElementById('modalBody').innerHTML = buildInformeHTML(total, mov.length, horas[0]||'—', horas[horas.length-1]||'—', calcularFranjas(mov), mov, total);
}

function calcularFranjas(movimientos) {
  const fc = FRANJAS.map(f => ({ ...f, cafes: 0, socios: new Set() }));
  movimientos.forEach(m => {
    (m.horarios || []).forEach(hora => {
      const h = parseInt(hora.split(':')[0], 10);
      const f = fc.find(f => h >= f.desde && h < f.hasta);
      if (f) { f.cafes++; f.socios.add(m.nombre); }
    });
  });
  return fc.map(f => ({ ...f, socios: f.socios.size }));
}

function buildInformeHTML(totalCafes, totalSocios, primerMov, ultimoMov, franjas, movimientos, maxCafes) {
  const fm = Math.max(...franjas.map(f => f.cafes), 1);
  const fHTML = franjas.map(f => {
    const pct = Math.round((f.cafes / fm) * 100);
    const pctT = maxCafes > 0 ? Math.round((f.cafes / maxCafes) * 100) : 0;
    return '<div class="franja-row"><div class="franja-meta"><span class="franja-nombre">' + f.emoji + ' ' + f.nombre + '</span><span class="franja-detalle">' + f.cafes + ' cafés · ' + pctT + '%</span></div><div class="franja-bar-bg"><div class="franja-bar" style="width:' + pct + '%"></div></div></div>';
  }).join('');
  const rows = [...movimientos].sort((a,b) => b.cafes - a.cafes).map(m =>
    '<tr><td>' + m.nombre + '</td><td>' + (m.dni||'—') + '</td><td style="text-align:center"><span class="badge-cafes">☕ ' + m.cafes + '</span></td><td style="color:var(--txt2)">' + ((m.horarios||[]).join(', ')||'—') + '</td></tr>'
  ).join('');
  const tabla = movimientos.length
    ? '<div style="overflow-x:auto"><table class="socios-tabla"><thead><tr><th>Socio</th><th>DNI</th><th style="text-align:center">Cafés</th><th>Horarios</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
    : '<p style="color:var(--txt2);font-size:13px;text-align:center;padding:12px">Sin movimientos.</p>';
  return '<div class="kpi-grid"><div class="kpi-card"><div class="kpi-num">' + totalCafes + '</div><div class="kpi-label">Cafés servidos</div></div><div class="kpi-card"><div class="kpi-num">' + totalSocios + '</div><div class="kpi-label">Socios atendidos</div></div><div class="kpi-card"><div class="kpi-num" style="font-size:20px;padding-top:8px">' + primerMov + '<br>→ ' + ultimoMov + '</div><div class="kpi-label">Rango horario</div></div></div><div class="section-title">Distribución horaria</div>' + fHTML + '<div class="section-title" style="margin-top:24px">Consumo por socio</div>' + tabla + '<div class="modal-actions"><button class="btn-pdf" onclick="window.print()">⬇️ Descargar PDF</button><button class="btn-cancelar" onclick="cerrarInforme()">Cerrar</button></div>';
}

document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) cerrarInforme(); });
document.getElementById('dniInput').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); });
</script>
</body>
</html>
